<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌推し収穫センター｜OBS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:flex;align-items:center;justify-content:center;font-family:"Yu Gothic","Meiryo",sans-serif;color:#214c38}#scene{width:min(100vw,100vh);height:min(100vw,100vh);position:relative;overflow:hidden;container-type:inline-size;background:linear-gradient(#dff6ff 0%,#edfaff 75%,#c6e497 75%,#e3efbd 100%)}body.transparent #scene{background:transparent}header{position:absolute;z-index:2;top:3%;left:5%;width:90%;text-align:center}header>span{font-size:1.4cqw;letter-spacing:.45em;font-weight:800}h1{font-size:3.5cqw;line-height:1.2;margin:.6cqw 0;overflow-wrap:anywhere;text-shadow:0 1px 2px white}header p{font-size:1.8cqw;margin:.7cqw 0;text-shadow:0 1px 2px white}header b{color:#df515a;font-size:2.6cqw}#stage{position:absolute;bottom:0;left:3%;width:94%;height:82%}.tree{width:100%;height:100%;position:absolute;inset:0}#fruits{position:absolute;left:16%;right:16%;top:13%;height:59%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:1% 3%}.fruit{position:relative;min-width:0;min-height:0}.apple{position:absolute;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 .3cqw .2cqw #15372045)}.name{position:absolute;left:-5%;width:110%;top:56%;height:43%;display:flex;justify-content:center;align-items:center;line-height:1.02;text-align:center;color:white;font-weight:900;text-shadow:1px 1px 2px #4c2415,-1px -1px 2px #4c2415,0 0 3px #4c2415;overflow-wrap:anywhere}.name span{max-width:100%}.new{position:absolute;right:-5%;top:0;font-size:1.2cqw;line-height:1.4;font-weight:900;color:#754d05;background:#fff6b5;border:1px solid #e4b839;border-radius:1cqw;padding:0 .6cqw;transform:rotate(8deg)}.sparkle{position:absolute;inset:-10%;font-size:3cqw;text-align:center;color:#fff8a2;animation:sparkle 1s 4 forwards;pointer-events:none}.arrive{animation:arrive 2s cubic-bezier(.2,.7,.2,1) both}#pageLabel{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);padding:.7cqw 2.6cqw;background:#ffffee;border-radius:3cqw;font-size:1.8cqw;font-weight:800}#status{position:absolute;top:49%;left:10%;width:80%;margin:0;text-align:center;color:white;text-shadow:0 1px 4px #184226;font-size:2.3cqw}#connection{position:absolute;bottom:7%;left:5%;width:90%;font-size:1.4cqw;text-align:center;background:#fff5d7e8;border-radius:1cqw;color:#79511a}#connection:empty{display:none}@keyframes arrive{0%{transform:translate(10cqw,-15cqw) scale(.2);opacity:0}65%{transform:translate(-.5cqw,1cqw) scale(1.12);opacity:1}100%{transform:none;opacity:1}}@keyframes sparkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}@media(prefers-reduced-motion:reduce){.arrive,.sparkle{animation:none}}
</style></head>
<body><main id="scene"><header><span>ABO FARM</span><h1 id="heading">歌推し収穫センター</h1><p><span id="month"></span> · 今月のりんご <b id="total">0</b> 個</p></header><div id="stage"><img class="tree" src="./assets/tree.png" alt="りんごの木"><div id="fruits"></div></div><div id="pageLabel">1本目 / 1本</div><p id="status" role="status">名簿を読み込み中…</p><p id="connection" role="status"></p></main>
<script type="module">
const loadFirebase = async () => {
 const modules = Promise.all([
 import("https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js"),
 import("https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js")
 ]);
 let timer;
 try { return await Promise.race([modules,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error("Firebaseライブラリの読み込みが15秒以内に完了しませんでした。回線やコンテンツブロッカーを確認してください。")),15000)})]); }
 finally { clearTimeout(timer); }
};
function explainError(e){
 const code=e?.code||"";
 if(code.includes("permission-denied"))return "Firebaseの読み取り権限で拒否されました（permission-denied）。この表示を管理者へ伝えてください。";
 if(code.includes("unauthenticated"))return "Firebaseの認証が必要です（unauthenticated）。";
 if(code.includes("unavailable"))return "Firebaseに接続できません（unavailable）。通信状態を確認してください。";
 return (code?code+"：":"")+(e?.message||String(e));
}
try {
 const [firebaseApp,firebaseStore]=await loadFirebase();
 const {initializeApp}=firebaseApp;
 const {getFirestore,collection,addDoc,serverTimestamp,onSnapshot,deleteDoc,doc,setDoc,updateDoc,getDoc}=firebaseStore;
const firebaseConfig = {
  apiKey: "AIzaSyDKwFPNTgPJawD47WxuDsJH2-V1E3zWqoU",
  authDomain: "utaoshi-ringo.firebaseapp.com",
  projectId: "utaoshi-ringo",
  storageBucket: "utaoshi-ringo.firebasestorage.app",
  messagingSenderId: "572385012765",
  appId: "1:572385012765:web:2f5542f69930f1a714eaf4",
  measurementId: "G-Q1XJVK2LH0"
};

const validMonth = value => /^\d{4}-(0[1-9]|1[0-2])$/.test(value || '');
const japanMonth = () => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit'}).format(new Date());
const timestamp = value => typeof value?.toMillis === 'function' ? value.toMillis() : typeof value?.seconds === 'number' ? value.seconds * 1000 : 0;
const isGold = fruit => fruit.gold === true || fruit.color === 'gold';
const isNew = (fruit,now=Date.now()) => timestamp(fruit.created)>0 && now-timestamp(fruit.created)>=0 && now-timestamp(fruit.created)<86400000;
const monthFruits = (rows,month) => rows.filter(f=>f.month===month).sort((a,b)=>timestamp(a.created)-timestamp(b.created)||a.id.localeCompare(b.id));
const treeCount = rows => Math.max(1,Math.ceil(rows.length/25));
const treeFruits = (rows,page) => rows.slice(page*25,page*25+25);





const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
const fixedMonth=validMonth(params.get('month'))?params.get('month'):null;
if(params.get('transparent')==='1')document.body.classList.add('transparent');
const db=getFirestore(initializeApp(firebaseConfig));
let rows=[],settings={},month='',page=0,seen=null,arriving=new Set(),holdUntil=0,settingsReady=false,rowsReady=false,lastTurn=Date.now(),timer;
let configError=false,dataError=false,cached=false;
function connection(){ $('connection').textContent=configError||dataError?'読み込めません。Firebaseの権限と接続を確認してください。':!navigator.onLine?'接続待ちです。再接続すると自動反映します。':cached?'保存済みデータを表示中・接続を確認しています。':''; }
function error(kind,e){if(kind==='config')configError=true;else dataError=true;connection();$('connection').textContent=explainError(e);$('status').textContent=rowsReady?'':'名簿の読み込みに失敗しました';}
function fitNames(){document.querySelectorAll('.name').forEach(box=>{const span=box.firstElementChild;let size=$('scene').clientWidth*.019;span.style.fontSize=size+'px';for(let i=0;i<60&&(span.scrollHeight>box.clientHeight||span.scrollWidth>box.clientWidth);i++){size*=.92;span.style.fontSize=size+'px';}});}
function render(){
 if(!settingsReady||!rowsReady)return;
 const list=monthFruits(rows,month),count=treeCount(list);page=Math.max(0,Math.min(page,count-1));
 const title=settings.titles?.[month] || (!settings.titles && settings.title) || '歌推し収穫センター';
 $('heading').textContent=title;$('month').textContent=month.replace('-','年')+'月';$('total').textContent=list.length;$('pageLabel').textContent=`${page+1}本目 / ${count}本`;
 $('status').textContent=list.length?'':'この月の歌推しさんをお待ちしています';
 $('fruits').replaceChildren();
 for(const f of treeFruits(list,page)){
  const el=document.createElement('div');el.className='fruit'+(arriving.has(f.id)?' arrive':'');
  const img=document.createElement('img');img.className='apple';img.src=isGold(f)?'./assets/gold.png':'./assets/red.png';img.alt=isGold(f)?'5k達成の金りんご':'赤りんご';
  const name=document.createElement('div');name.className='name';const text=document.createElement('span');text.textContent=f.name||'名前未設定';name.append(text);el.append(img,name);
  if(isNew(f)){const badge=document.createElement('span');badge.className='new';badge.textContent='NEW';badge.dataset.created=String(f.created.toMillis?.()??f.created.seconds*1000);el.append(badge);}
  if(arriving.has(f.id)){const star=document.createElement('span');star.className='sparkle';star.textContent='✦ ⋆ ✧';el.append(star);}
  $('fruits').append(el);
 }
 requestAnimationFrame(fitNames);
}
function update(){
 if(!settingsReady||!rowsReady)return;
 const next=fixedMonth || (validMonth(settings.month)?settings.month:japanMonth());
 if(next!==month){month=next;seen=null;page=0;arriving.clear();clearTimeout(timer);}
 const list=monthFruits(rows,month),added=seen?list.filter(f=>!seen.has(f.id)):[];
 seen=new Set(list.map(f=>f.id));
 if(added.length){arriving=new Set(added.map(f=>f.id));page=Math.floor(list.findIndex(f=>f.id===added[added.length-1].id)/25);holdUntil=Date.now()+12000;clearTimeout(timer);timer=setTimeout(()=>{arriving.clear();document.querySelectorAll('.arrive').forEach(el=>el.classList.remove('arrive'));document.querySelectorAll('.sparkle').forEach(el=>el.remove());},4500);}
 render();
}
onSnapshot(doc(db,'settings','banner'),snap=>{settings=snap.exists()?snap.data():{};settingsReady=true;configError=false;connection();update();},e=>error('config',e));
onSnapshot(collection(db,'utaooshi'),{includeMetadataChanges:true},snap=>{dataError=false;cached=snap.metadata.fromCache;connection();rows=snap.docs.map(d=>({...d.data(),id:d.id}));rowsReady=true;update();},e=>error('data',e));
setInterval(()=>{const now=Date.now();if(now>=holdUntil&&now-lastTurn>=10000&&treeCount(monthFruits(rows,month))>1){page=(page+1)%treeCount(monthFruits(rows,month));lastTurn=now;render();}document.querySelectorAll('.new').forEach(el=>{if(now-Number(el.dataset.created)>=86400000)el.remove();});},1000);
new ResizeObserver(fitNames).observe($('scene'));
window.addEventListener('online',connection);window.addEventListener('offline',connection);

setTimeout(()=>{if(!settingsReady||!rowsReady){$('status').textContent="Firebaseからデータを受信できていません";$('connection').textContent="接続とFirestoreの設定を確認してください。管理画面にもエラーが出ているか確認してください。";}},15000);

} catch(e){document.getElementById("status").textContent="読み込みを開始できませんでした";document.getElementById("connection").textContent=explainError(e);console.error(e);}
</script></body></html>
