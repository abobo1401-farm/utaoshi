<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌推し収穫センター｜OBS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{display:flex;align-items:center;justify-content:center;font-family:"Yu Gothic","Meiryo",sans-serif;color:#214c38}#scene{width:min(100vw,100vh);height:min(100vw,100vh);position:relative;overflow:hidden;container-type:inline-size;background:linear-gradient(#dff6ff 0%,#edfaff 75%,#c6e497 75%,#e3efbd 100%)}body.transparent #scene{background:transparent}header{position:absolute;z-index:2;top:3%;left:5%;width:90%;text-align:center}header>span{font-size:1.4cqw;letter-spacing:.45em;font-weight:800}h1{font-size:3.5cqw;line-height:1.2;margin:.6cqw 0;overflow-wrap:anywhere;text-shadow:0 1px 2px white}header p{font-size:1.8cqw;margin:.7cqw 0;text-shadow:0 1px 2px white}header b{color:#df515a;font-size:2.6cqw}#stage{position:absolute;bottom:0;left:3%;width:94%;height:82%}.tree{width:100%;height:100%;position:absolute;inset:0}#fruits{position:absolute;left:16%;right:16%;top:13%;height:59%;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:1% 3%}.fruit{position:relative;min-width:0;min-height:0}.apple{position:absolute;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 .3cqw .2cqw #15372045)}.name{position:absolute;left:-5%;width:110%;top:56%;height:43%;display:flex;justify-content:center;align-items:center;line-height:1.02;text-align:center;color:white;font-weight:900;text-shadow:1px 1px 2px #4c2415,-1px -1px 2px #4c2415,0 0 3px #4c2415;overflow-wrap:anywhere}.name span{max-width:100%}.new{position:absolute;right:-5%;top:0;font-size:1.2cqw;line-height:1.4;font-weight:900;color:#754d05;background:#fff6b5;border:1px solid #e4b839;border-radius:1cqw;padding:0 .6cqw;transform:rotate(8deg)}.sparkle{position:absolute;inset:-10%;font-size:3cqw;text-align:center;color:#fff8a2;animation:sparkle 1s 4 forwards;pointer-events:none}.arrive{animation:arrive 2s cubic-bezier(.2,.7,.2,1) both}#pageLabel{position:absolute;bottom:2%;left:50%;transform:translateX(-50%);padding:.7cqw 2.6cqw;background:#ffffee;border-radius:3cqw;font-size:1.8cqw;font-weight:800}#status{position:absolute;top:49%;left:10%;width:80%;margin:0;text-align:center;color:white;text-shadow:0 1px 4px #184226;font-size:2.3cqw}#connection{position:absolute;bottom:7%;left:5%;width:90%;font-size:1.4cqw;text-align:center;background:#fff5d7e8;border-radius:1cqw;color:#79511a}#connection:empty{display:none}@keyframes arrive{0%{transform:translate(10cqw,-15cqw) scale(.2);opacity:0}65%{transform:translate(-.5cqw,1cqw) scale(1.12);opacity:1}100%{transform:none;opacity:1}}@keyframes sparkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}@media(prefers-reduced-motion:reduce){.arrive,.sparkle{animation:none}}

.sway{position:absolute;inset:0;transform-origin:50% 5%;animation:sway var(--duration,4s) ease-in-out var(--delay,0s) infinite alternate}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.clouds{position:absolute;inset:0;overflow:hidden;pointer-events:none}.cloud{position:absolute;left:0;width:28%;height:8%;top:18%;animation:cloud-drift 70s linear infinite;opacity:.82}.cloud:nth-child(2){top:31%;width:20%;height:6%;animation-duration:95s;animation-delay:-50s;opacity:.65}.cloud:nth-child(3){top:9%;width:24%;height:7%;animation-duration:110s;animation-delay:-25s;opacity:.7}.cloud:nth-child(1){animation-delay:-14s}.cloud i{position:absolute;display:block;background:white;border-radius:50%;bottom:0;width:65%;height:60%}.cloud i:nth-child(2){left:22%;bottom:12%;width:50%;height:95%}.cloud i:nth-child(3){left:55%;width:45%;height:65%}@keyframes cloud-drift{from{transform:translateX(-150%)}to{transform:translateX(550%)}}
body.share-page{display:block;height:auto;overflow:auto;background:#eef5ef;padding:16px}body.share-page #scene{width:min(100%,720px);height:auto;aspect-ratio:1;margin:auto}.share-tools{display:none;max-width:720px;margin:16px auto;color:#244936;font-size:16px;line-height:1.7}.share-page .share-tools{display:block}.share-tools button,.share-tools a{display:inline-block;padding:10px 16px;margin:4px;border:0;border-radius:10px;background:#236044;color:white;font-size:16px;text-decoration:none;cursor:pointer}.share-tools button:disabled{opacity:.45;cursor:default}.share-tools img{max-width:100%;display:block;margin:12px auto;border-radius:10px}.share-tools [hidden]{display:none!important}#shareMsg{min-height:1.7em}.share-tools small{display:block}html:has(body.share-page){height:auto;overflow:auto}.snapshot .sway{animation:none;transform:none}.snapshot .arrive{animation:none}.snapshot .sparkle{display:none}.snapshot .cloud{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.sway,.cloud{animation:none}.cloud:nth-child(1){left:8%}.cloud:nth-child(2){left:70%}.cloud:nth-child(3){left:43%}}

/* Portrait OBS canvas: fit 9:16 without stretching the tree. */
body.portrait #scene{width:min(100vw,56.25vh);height:min(177.7777778vw,100vh)}
body.portrait #stage{width:94%;height:auto;aspect-ratio:1;top:50%;bottom:auto;transform:translateY(-50%)}
body.portrait header{top:12%;left:5%;width:90%}
body.portrait header>span{font-size:2cqw}
body.portrait h1{font-size:4.5cqw;line-height:1.3;margin:1.8cqw 0}
body.portrait header p{font-size:2.8cqw;margin:1.4cqw 0}

body.portrait #status{top:59%;font-size:2.8cqw}
body.portrait .cloud{height:4.5%;top:23%}
body.portrait .cloud:nth-child(2){height:3.4%;top:35%}
body.portrait .cloud:nth-child(3){height:4%;top:6%}
body.portrait.share-page #scene{width:min(100%,540px);height:auto;aspect-ratio:9/16}
</style></head>
<body><main id="scene"><div class="clouds" aria-hidden="true"><div class="cloud"><i></i><i></i><i></i></div><div class="cloud"><i></i><i></i><i></i></div><div class="cloud"><i></i><i></i><i></i></div></div><header><span>ABO FARM</span><h1 id="heading">歌推し収穫センター</h1><p><span id="month"></span> · 今月のりんご <b id="total">0</b> 個</p></header><div id="stage"><img class="tree" src="./assets/tree.png" alt="りんごの木"><div id="fruits"></div></div><div id="pageLabel">1本目 / 1本</div><p id="status" role="status">名簿を読み込み中…</p><p id="connection" role="status"></p></main><section class="share-tools" aria-label="投稿用画像"><div><button id="prevTree" disabled>◀ 前の木</button><span id="sharePage">1 / 1</span><button id="nextTree" disabled>次の木 ▶</button></div><button id="makeImage" disabled>この木の投稿画像を作る</button><p id="shareMsg" role="status">名簿の読み込み後に画像を作成できます。</p><div id="imageActions" hidden><img id="imagePreview" alt="投稿用画像のプレビュー"><a id="saveImage" download>画像を保存</a><button id="nativeShare" hidden>画像を共有（Xなど）</button><a id="postX" target="_blank" rel="noopener noreferrer">Xに投稿</a><small>「Xに投稿」は投稿文を開きます。保存した画像を添付してください。スマホの「画像を共有」でXを選べる場合は、画像も渡せます。</small></div></section>
<script type="module">
if(new URLSearchParams(location.search).get('share')==='1')document.body.classList.add('share-page');
if(new URLSearchParams(location.search).get('portrait')==='1')document.body.classList.add('portrait');
const loadFirebase = async () => {
 const modules = Promise.all([
 import("https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js"),
 import("https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js")
 ]);
 let timer;
 try { return await Promise.race([modules,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error("Firebaseライブラリの読み込みが15秒以内に完了しませんでした。回線やコンテンツブロッカーを確認してください。")),15000)})]); }
 finally { clearTimeout(timer); }
};
function explainError(e){
 const code=e?.code||"";
 if(code.includes("permission-denied"))return "Firebaseの読み取り権限で拒否されました（permission-denied）。この表示を管理者へ伝えてください。";
 if(code.includes("unauthenticated"))return "Firebaseの認証が必要です（unauthenticated）。";
 if(code.includes("unavailable"))return "Firebaseに接続できません（unavailable）。通信状態を確認してください。";
 return (code?code+"：":"")+(e?.message||String(e));
}
try {
 const [firebaseApp,firebaseStore]=await loadFirebase();
 const {initializeApp}=firebaseApp;
 const {getFirestore,collection,addDoc,serverTimestamp,onSnapshot,deleteDoc,doc,setDoc,updateDoc,getDoc}=firebaseStore;
const firebaseConfig = {
  apiKey: "AIzaSyDKwFPNTgPJawD47WxuDsJH2-V1E3zWqoU",
  authDomain: "utaoshi-ringo.firebaseapp.com",
  projectId: "utaoshi-ringo",
  storageBucket: "utaoshi-ringo.firebasestorage.app",
  messagingSenderId: "572385012765",
  appId: "1:572385012765:web:2f5542f69930f1a714eaf4",
  measurementId: "G-Q1XJVK2LH0"
};

const validMonth = value => /^\d{4}-(0[1-9]|1[0-2])$/.test(value || '');
const japanMonth = () => new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit'}).format(new Date());
const timestamp = value => typeof value?.toMillis === 'function' ? value.toMillis() : typeof value?.seconds === 'number' ? value.seconds * 1000 : 0;
const isGold = fruit => fruit.gold === true || fruit.color === 'gold';
const isNew = (fruit,now=Date.now()) => timestamp(fruit.created)>0 && now-timestamp(fruit.created)>=0 && now-timestamp(fruit.created)<86400000;
const monthFruits = (rows,month) => rows.filter(f=>f.month===month).sort((a,b)=>timestamp(a.created)-timestamp(b.created)||a.id.localeCompare(b.id));
const treeCount = rows => Math.max(1,Math.ceil(rows.length/25));
const treeFruits = (rows,page) => rows.slice(page*25,page*25+25);





const $=id=>document.getElementById(id), params=new URLSearchParams(location.search);
const fixedMonth=validMonth(params.get('month'))?params.get('month'):null;
if(params.get('transparent')==='1')document.body.classList.add('transparent');
const shareMode=params.get('share')==='1';if(shareMode)document.body.classList.add('share-page');
const db=getFirestore(initializeApp(firebaseConfig));
let rows=[],settings={},month='',page=0,seen=null,arriving=new Set(),holdUntil=0,settingsReady=false,rowsReady=false,lastTurn=Date.now(),timer;
let configError=false,dataError=false,cached=false;
function connection(){ $('connection').textContent=configError||dataError?'読み込めません。Firebaseの権限と接続を確認してください。':!navigator.onLine?'接続待ちです。再接続すると自動反映します。':cached?'保存済みデータを表示中・接続を確認しています。':''; }
function error(kind,e){if(kind==='config')configError=true;else dataError=true;connection();$('connection').textContent=explainError(e);$('status').textContent=rowsReady?'':'名簿の読み込みに失敗しました';}
function fitNames(){document.querySelectorAll('.name').forEach(box=>{const span=box.firstElementChild;let size=$('scene').clientWidth*.019;span.style.fontSize=size+'px';for(let i=0;i<60&&(span.scrollHeight>box.clientHeight||span.scrollWidth>box.clientWidth);i++){size*=.92;span.style.fontSize=size+'px';}});}
function render(){
 if(!settingsReady||!rowsReady)return;
 const list=monthFruits(rows,month),count=treeCount(list);page=Math.max(0,Math.min(page,count-1));
 const title=settings.titles?.[month] || (!settings.titles && settings.title) || '歌推し収穫センター';
 $('heading').textContent=title;$('month').textContent=month.replace('-','年')+'月';$('total').textContent=list.length;$('pageLabel').textContent=`${page+1}本目 / ${count}本`;
 $('status').textContent=list.length?'':'この月の歌推しさんをお待ちしています';
 $('fruits').replaceChildren();
 for(const f of treeFruits(list,page)){
  const el=document.createElement('div');el.className='fruit'+(arriving.has(f.id)?' arrive':'');
  const sway=document.createElement('div');sway.className='sway';let seed=0;for(const ch of f.id)seed=(seed*31+ch.charCodeAt(0))>>>0;sway.style.setProperty('--duration',(3.5+seed%20/10)+'s');sway.style.setProperty('--delay',-(seed%50)/10+'s');el.append(sway);
  const img=document.createElement('img');img.className='apple';img.src=isGold(f)?'./assets/gold.png':'./assets/red.png';img.alt=isGold(f)?'5k達成の金りんご':'赤りんご';
  const name=document.createElement('div');name.className='name';const text=document.createElement('span');text.textContent=f.name||'名前未設定';name.append(text);sway.append(img,name);
  if(isNew(f)){const badge=document.createElement('span');badge.className='new';badge.textContent='NEW';badge.dataset.created=String(f.created.toMillis?.()??f.created.seconds*1000);sway.append(badge);}
  if(arriving.has(f.id)){const star=document.createElement('span');star.className='sparkle';star.textContent='✦ ⋆ ✧';sway.append(star);}
  $('fruits').append(el);
 }
 if(shareMode){$("makeImage").disabled=imageBusy;$("prevTree").disabled=page===0;$("nextTree").disabled=page===count-1;$("sharePage").textContent=`${page+1} / ${count}`;}
 requestAnimationFrame(fitNames);
}
function update(){
 if(!settingsReady||!rowsReady)return;
 const next=fixedMonth || (validMonth(settings.month)?settings.month:japanMonth());
 if(next!==month){month=next;seen=null;page=0;arriving.clear();clearTimeout(timer);}
 const list=monthFruits(rows,month),added=seen?list.filter(f=>!seen.has(f.id)):[];
 seen=new Set(list.map(f=>f.id));
 if(added.length){arriving=new Set(added.map(f=>f.id));page=Math.floor(list.findIndex(f=>f.id===added[added.length-1].id)/25);holdUntil=Date.now()+12000;clearTimeout(timer);timer=setTimeout(()=>{arriving.clear();document.querySelectorAll('.arrive').forEach(el=>el.classList.remove('arrive'));document.querySelectorAll('.sparkle').forEach(el=>el.remove());},4500);}
 render();
}
onSnapshot(doc(db,'settings','banner'),snap=>{settings=snap.exists()?snap.data():{};settingsReady=true;configError=false;connection();update();},e=>error('config',e));
onSnapshot(collection(db,'utaooshi'),{includeMetadataChanges:true},snap=>{dataError=false;cached=snap.metadata.fromCache;connection();rows=snap.docs.map(d=>({...d.data(),id:d.id}));rowsReady=true;update();},e=>error('data',e));
setInterval(()=>{const now=Date.now();if(!shareMode&&now>=holdUntil&&now-lastTurn>=10000&&treeCount(monthFruits(rows,month))>1){page=(page+1)%treeCount(monthFruits(rows,month));lastTurn=now;render();}document.querySelectorAll('.new').forEach(el=>{if(now-Number(el.dataset.created)>=86400000)el.remove();});},1000);
let preparedFile=null,preparedUrl=null,imageBusy=false;
function clearPrepared(){preparedFile=null;if(preparedUrl){URL.revokeObjectURL(preparedUrl);preparedUrl=null;}$('imageActions').hidden=true;}
$('prevTree').addEventListener('click',()=>{page=Math.max(0,page-1);clearPrepared();render();});
$('nextTree').addEventListener('click',()=>{page=Math.min(treeCount(monthFruits(rows,month))-1,page+1);clearPrepared();render();});
async function captureTree(){
 const scene=$('scene');
 await document.fonts.ready;
 await Promise.all([...scene.querySelectorAll('img')].map(img=>img.decode()));
 scene.classList.add('snapshot');
 try{
 await new Promise(resolve=>requestAnimationFrame(resolve));fitNames();
 const bounds=scene.getBoundingClientRect(),k=1080/bounds.width;
 const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=Math.round(bounds.height*k);const ctx=canvas.getContext('2d');
 const rect=el=>{const r=el.getBoundingClientRect();return {x:(r.left-bounds.left)*k,y:(r.top-bounds.top)*k,w:r.width*k,h:r.height*k};};
 const grad=ctx.createLinearGradient(0,0,0,canvas.height);grad.addColorStop(0,'#dff6ff');grad.addColorStop(.749,'#edfaff');grad.addColorStop(.75,'#c6e497');grad.addColorStop(1,'#e3efbd');ctx.fillStyle=grad;ctx.fillRect(0,0,canvas.width,canvas.height);
 scene.querySelectorAll('.cloud').forEach(cloud=>{ctx.globalAlpha=Number(getComputedStyle(cloud).opacity);cloud.querySelectorAll('i').forEach(part=>{const r=rect(part);ctx.beginPath();ctx.ellipse(r.x+r.w/2,r.y+r.h/2,r.w/2,r.h/2,0,0,Math.PI*2);ctx.fillStyle='white';ctx.fill();});});ctx.globalAlpha=1;
 function drawImage(img,contain=false){const r=rect(img);let w=r.w,h=r.h;if(contain){const ratio=Math.min(w/img.naturalWidth,h/img.naturalHeight);w=img.naturalWidth*ratio;h=img.naturalHeight*ratio;}ctx.drawImage(img,r.x+(r.w-w)/2,r.y+(r.h-h)/2,w,h);}
 function paintText(el,shadow=false){const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let node;while(node=walker.nextNode()){const style=getComputedStyle(node.parentElement),size=parseFloat(style.fontSize)*k;ctx.font=`${style.fontWeight} ${size}px ${style.fontFamily}`;ctx.fillStyle=style.color;ctx.textBaseline='top';ctx.shadowColor=shadow?'#4c2415':'transparent';ctx.shadowBlur=shadow?2*k:0;const range=document.createRange();let offset=0;for(const ch of node.textContent){range.setStart(node,offset);offset+=ch.length;range.setEnd(node,offset);const r=range.getBoundingClientRect();if(r.width&&r.height)ctx.fillText(ch,(r.left-bounds.left)*k,(r.top-bounds.top)*k+(r.height*k-size)/2);}ctx.shadowBlur=0;}}
 drawImage(scene.querySelector('.tree'));
 scene.querySelectorAll('.fruit').forEach(f=>{drawImage(f.querySelector('.apple'),true);paintText(f.querySelector('.name'),true);const badge=f.querySelector('.new');if(badge){const r=rect(badge);ctx.fillStyle='#fff6b5';ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,8);ctx.fill();paintText(badge);}});
 paintText(scene.querySelector('header'));
 const label=$('pageLabel'),r=rect(label);ctx.fillStyle='#ffffee';ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,30);ctx.fill();paintText(label);
 const info={month,page,title:$('heading').textContent,monthLabel:$('month').textContent,total:$('total').textContent,pageLabel:$('pageLabel').textContent};
 const blob=await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('画像を作成できませんでした')),'image/png'));return {blob,...info};
 }finally{scene.classList.remove('snapshot');}
}
$('makeImage').addEventListener('click',async()=>{
 const btn=$('makeImage');if(imageBusy)return;imageBusy=true;btn.disabled=true;$('shareMsg').textContent='画像を作成しています…';clearPrepared();
 try{const captured=await captureTree(),blob=captured.blob;preparedFile=new File([blob],`utaoshi-${captured.month}-tree-${captured.page+1}.png`,{type:'image/png'});preparedUrl=URL.createObjectURL(blob);$('imagePreview').src=preparedUrl;$('saveImage').href=preparedUrl;$('saveImage').download=preparedFile.name;
 const postText=`${captured.title}\n${captured.monthLabel}の歌推しさん、ありがとう！🍎\n今月のりんご ${captured.total}個（${captured.pageLabel}）\nレッツ！フレッシュ！リフレッシュ！`;
 $('postX').href='https://twitter.com/intent/tweet?text='+encodeURIComponent(postText);
 $('nativeShare').hidden=!(navigator.canShare&&navigator.canShare({files:[preparedFile]}));$('imageActions').hidden=false;$('shareMsg').textContent='画像ができました。保存してXに添付、または「画像を共有」を押してください。';
 }catch(e){$('shareMsg').textContent='画像作成に失敗：'+(e.message||e)+'。assetsフォルダの画像が開けるか確認してください。';}finally{imageBusy=false;btn.disabled=false;}
});
$('nativeShare').addEventListener('click',async()=>{if(!preparedFile)return;try{await navigator.share({files:[preparedFile],title:'歌推し収穫センター'});$('shareMsg').textContent='共有操作が完了しました。投稿状況は共有先で確認してください。';}catch(e){if(e.name!=='AbortError')$('shareMsg').textContent='共有できませんでした。「画像を保存」してXに添付してください。';}});

new ResizeObserver(fitNames).observe($('scene'));
window.addEventListener('online',connection);window.addEventListener('offline',connection);

setTimeout(()=>{if(!settingsReady||!rowsReady){$('status').textContent="Firebaseからデータを受信できていません";$('connection').textContent="接続とFirestoreの設定を確認してください。管理画面にもエラーが出ているか確認してください。";}},15000);

} catch(e){document.getElementById("status").textContent="読み込みを開始できませんでした";document.getElementById("connection").textContent=explainError(e);console.error(e);}
</script></body></html>
