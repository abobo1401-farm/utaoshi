<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>歌推しテロップ</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:transparent;
    font-family:"Yu Gothic","Meiryo",sans-serif;
}

.bar{
    width:100vw;
    height:86px;
    display:flex;
    align-items:center;
    overflow:hidden;
    font-size:32px;
}

.title{
    min-width:280px;
    height:76px;
    padding:0 24px;
    margin-left:10px;
    box-sizing:border-box;
    background:linear-gradient(180deg,#ff8ad4,#ff4fa3);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    white-space:nowrap;
    font-weight:bold;
    flex-shrink:0;
    border:2px solid #ffd6ec;
    border-radius:999px;
    box-shadow:0 0 18px rgba(255,90,180,.8);
    text-shadow:2px 2px 0 #c92b78;
}

.marqueeWrap{
    flex:1;
    height:76px;
    margin-left:10px;
    background:rgba(255,255,255,0.88);
    border:4px solid #ffd6ec;
    border-radius:999px;
    overflow:hidden;
    display:flex;
    align-items:center;
    box-shadow:0 0 16px rgba(255,170,220,.7);
}

.marquee{
    display:inline-block;
    white-space:nowrap;
    padding-left:100%;
    animation:scroll 45s linear infinite;
    color:#ff3f95;
    font-weight:bold;
    text-shadow:
      2px 2px 0 white,
      3px 3px 0 rgba(255,120,190,.35);
}

.new{
    display:inline-block;
    margin:0 8px;
    padding:2px 10px;
    background:#ffdf3d;
    color:#ff2f7d;
    border-radius:999px;
    font-size:24px;
    font-weight:bold;
    box-shadow:0 0 10px rgba(255,220,40,.8);
}

@keyframes scroll{
    from{transform:translateX(0);}
    to{transform:translateX(-100%);}
}
</style>
</head>

<body>

<div class="bar">
    <div class="title" id="title">🍎 本日の収穫 🍎</div>

    <div class="marqueeWrap">
        <div class="marquee" id="news">読み込み中...</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc }
    from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKwFPNTgPJawD47WxuDsJH2-V1E3zWqoU",
  authDomain: "utaoshi-ringo.firebaseapp.com",
  projectId: "utaoshi-ringo",
  storageBucket: "utaoshi-ringo.firebasestorage.app",
  messagingSenderId: "572385012765",
  appId: "1:572385012765:web:2f5542f69930f1a714eaf4",
  measurementId: "G-Q1XJVK2LH0"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const params     = new URLSearchParams(location.search);
const fixedMonth = params.get("month");
const thisMonth  = () => new Date().toISOString().slice(0,7);

const NEW_LIMIT = 30 * 60 * 1000;

let liveMonth = fixedMonth || thisMonth();
let titles    = {};
let docsAll   = [];

onSnapshot(doc(db,"settings","banner"),(snap)=>{
    const d = snap.exists() ? snap.data() : {};
    titles = d.titles || {};
    if(!Object.keys(titles).length && d.title) titles[d.month || thisMonth()] = d.title;
    if(!fixedMonth) liveMonth = d.month || thisMonth();
    render();
});

onSnapshot(collection(db,"utaooshi"),(snap)=>{
    docsAll = snap.docs.map(d=>d.data());
    render();
});

function render(){
    const title = titles[liveMonth] || `${Number(liveMonth.slice(5,7))}月の収穫`;
    document.getElementById("title").textContent = `🍎 ${title} 🍎`;

    const now  = Date.now();
    const list = docsAll
        .filter(d=>d.month === liveMonth)
        .sort((a,b)=>ts(b.created)-ts(a.created));

    let text = "";
    list.forEach(d=>{
        const apple = d.color === "green" ? "🍏" : d.color === "yellow" ? "🍋" : "🍎";
        const isNew = d.created && d.created.toDate
            ? (now - d.created.toDate().getTime()) <= NEW_LIMIT
            : false;
        const newMark = isNew ? `<span class="new">NEW</span>` : "";
        text += `${apple}${newMark}${esc(d.name)}　　`;
    });

    document.getElementById("news").innerHTML = text || "まだ収穫はありません🍎";
}

setInterval(render, 60 * 1000);

const ts  = c => c && c.seconds ? c.seconds : 0;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
</script>

</body>
</html>
